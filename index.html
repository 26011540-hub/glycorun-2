<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14253d" />
    <title>GlycoRun 2</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Pista do jogo GlycoRun 2"></canvas>

      <div id="hud" class="hud" hidden>
        <div class="pill" id="lives" aria-label="Vidas"></div>
        <div class="pill" id="score">0</div>
        <div class="pill dim" id="dist">0 m</div>
        <button class="pill btn" id="pauseBtn" aria-label="Pausar">II</button>
      </div>
      <div id="fps" class="fps" hidden></div>

      <div class="overlay" id="menu">
        <div class="panel">
          <h1>Glyco<span>Run</span> 2</h1>
          <p class="tag">Protótipo · etapa 1</p>
          <p>Deslize na tela (ou use as setas): <b>◀ ▶</b> troca de faixa, <b>▲</b> pula, <b>▼</b> abaixa.</p>
          <ul>
            <li><b class="c-sofa">Sofá</b>: pule.</li>
            <li><b class="c-tela">Tela</b>: abaixe.</li>
            <li><b class="c-pilha">Pilha de telas</b>: desvie.</li>
          </ul>
          <button id="play">Jogar</button>
        </div>
      </div>

      <div class="overlay" id="pause" hidden>
        <div class="panel">
          <h2>Pausado</h2>
          <button id="resume">Continuar</button>
        </div>
      </div>

      <div class="overlay" id="over" hidden>
        <div class="panel">
          <h2>Fim de corrida</h2>
          <p id="overStats"></p>
          <button id="again">Jogar de novo</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
